#inference settings


run: null
output_root: /content/drive/MyDrive/poetry-lora-outputs
save_generations: true          

length:
  min_words: 100                
  max_words: 200                
  ending_strength: 8.0          # end-token logit boost reached at max_words

sampling:
  temperature: 0.9              
  top_p: 0.95
  min_p: 0.05                  
                                
  seed: 42                      

repetition:
  # never repeat any exact 6-token sequence
  no_repeat_ngram_size: 6
  frequency_penalty: 0.3
  window: 96
