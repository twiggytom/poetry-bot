#training configs for LoRA on Qwen2.5-7B

model:
  base_model: Qwen/Qwen2.5-7B
# prompt-response template used
  max_seq_length: 1280     # same tokenizer and chat template as 1.5B

data:
  train_file: data/processed_training.json
  val_file: data/processed_val.json
  test_file: data/processed_test.json

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  learning_rate: 2.0e-4   
  num_epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 4  
  lr_scheduler: cosine
  warmup_ratio: 0.05
  precision: bf16
  eval_steps: 25              
  save_steps: 25              
  save_total_limit: 3         
  logging_steps: 5            
  per_device_eval_batch_size: 4
  gradient_checkpointing: true  
  seed: 42
